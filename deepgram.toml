[meta]
title = "Next.js Live Transcription"
description = "Deepgram Live Transcription with a shared HTML frontend and Next.js API backend"
author = "Deepgram DX Team <devrel@deepgram.com> (https://developers.deepgram.com)"
repository = "https://github.com/deepgram-devs/nextjs-live-transcription"
useCase = "live-transcription"
language = "javascript"
framework = "nextjs"
sdk = "@deepgram/sdk"
tags = ["live-transcription", "live-stt", "real-time-transcription", "streaming-transcription", "live-speech-to-text", "javascript", "nextjs"]

[check]
command = "make check"
message = "Node 24+ and Corepack are available"

[install.pre]
command = "git submodule update --init --recursive"
message = "Frontend and contracts submodules initialized"

[install]
command = ["corepack pnpm install --frozen-lockfile", "cd frontend && corepack pnpm install --frozen-lockfile"]
message = "Backend and frontend dependencies installed"

[install.config]
sample = "sample.env.local"
output = ".env.local"

[start]
command = ["corepack pnpm run dev", "cd frontend && corepack pnpm run dev -- --port 8080 --no-open"]
parallel = true
message = "Frontend on http://localhost:8080; Next API and WebSocket backend on http://localhost:8081"

[build]
command = ["corepack pnpm run build", "cd frontend && corepack pnpm run build"]
message = "Next backend and production frontend built"

[update]
command = "git submodule update --remote --merge"
message = "Submodules updated"

[clean]
command = ["rm -rf node_modules", "rm -rf .next", "rm -rf frontend/node_modules", "rm -rf frontend/dist"]
message = "Build artifacts cleaned"

[eject-frontend]
command = "make eject-frontend"
message = "Frontend remains pinned as a shared submodule"

[test]
command = "corepack pnpm test"
message = "Next production build and WebSocket server syntax completed"
